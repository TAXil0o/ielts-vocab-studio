name: Deploy LEX 07.5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download site bundle
        run: |
          curl -L --fail --retry 4 \
            "https://github.com/${{ github.repository }}/releases/download/site-assets/site.zip" \
            -o site.zip

      - name: Unpack static site
        run: |
          rm -rf _site
          mkdir -p _site
          unzip -q site.zip -d _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
